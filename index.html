<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>새찬송가 v6</title> <!-- 버전 표시로 확인 가능케 함 -->
  <style>
    :root {
      --bg: #000000; --text: #ffffff; --sub-text: #a1a1aa;
      --card-bg: #121212; --primary: #60a5fa; --border: #27272a;
      --star-color: #f59e0b; --chorus-color: #facc15;
    }
    body.light-mode {
      --bg: #ffffff; --text: #191f28; --sub-text: #8b95a1;
      --card-bg: #f9fafb; --primary: #2563eb; --border: #e5e8eb;
      --chorus-color: #d97706;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; letter-spacing: -0.5px; }
    body { background: var(--bg); color: var(--text); user-select: none; overflow: hidden; }

    header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--border); padding: 6px 16px; display: flex; gap: 8px; z-index: 100; height: 52px; align-items: center; }
    .search-input { flex: 1; padding: 8px 12px; border: 1px solid #ffffff; border-radius: 6px; font-size: 18px; background-color: #ffffff !important; color: #000000 !important; outline: none; }
    .btn-icon { height: 38px; padding: 0 10px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; font-size: 16px; cursor: pointer; color: var(--text); }

    .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg); height: 40px; }
    .tab { flex: 1; text-align: center; line-height: 40px; font-size: 18px; font-weight: bold; color: var(--sub-text); cursor: pointer; }
    .tab.active { color: var(--primary); border-bottom: 3px solid var(--primary); }

    .list-view { padding: 0; height: calc(100vh - 92px); overflow-y: auto; }
    .hymn-card { display: flex; align-items: center; padding: 2px 16px; height: 38px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .hymn-num { width: 60px; font-size: 21px; font-weight: bold; color: var(--primary); }
    .hymn-title { flex: 1; font-size: 21px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .star-icon { font-size: 20px; color: #3f3f46; }
    .star-icon.active { color: var(--star-color); }

    /* 가사 뷰어: 스와이프가 잘 작동하도록 설정 */
    #viewer {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); flex-direction: column; z-index: 200;
      touch-action: pan-y; /* 세로 스크롤은 브라우저에 맡기고, 가로는 우리가 가로챔 */
    }
    .viewer-header { padding: 0 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg); height: 52px; }
    .viewer-title { font-size: 20px; font-weight: bold; max-width: 55%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .font-btns { display: flex; gap: 4px; }
    .font-btns button { padding: 6px 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); border-radius: 4px; font-size: 14px; }
    
    .viewer-lyrics { flex: 1; padding: 20px; overflow-y: auto; line-height: 1.5; font-size: 28px; }
    
    /* 화면 전환 시 깜빡임 효과 */
    .fade-in { animation: fadeIn 0.2s ease-in; }
    @keyframes fadeIn { from { opacity: 0.5; } to { opacity: 1; } }

    .verse-block { margin-top: 18px; }
    .verse-block:first-child { margin-top: 0; }
    .chorus-text { color: var(--chorus-color) !important; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <input type="text" id="searchInput" class="search-input" placeholder="검색">
    <button class="btn-icon" onclick="toggleTheme()">☀️/🌙</button>
  </header>
  <div class="tabs">
    <div class="tab active" id="tabAll" onclick="changeTab('all')">전체</div>
    <div class="tab" id="tabFav" onclick="changeTab('fav')">⭐ 즐겨찾기</div>
  </div>
  <div class="list-view" id="hymnList"></div>

  <div id="viewer">
    <div class="viewer-header">
      <button class="btn-icon" onclick="closeViewer()">⬅ 뒤로</button>
      <div class="viewer-title" id="viewerTitle"></div>
      <div class="font-btns">
        <button onclick="changeFontSize(-2)">가-</button>
        <button onclick="changeFontSize(2)">가+</button>
        <button id="viewerStar" class="btn-icon" onclick="toggleFavCurrent()">★</button>
      </div>
    </div>
    <div class="viewer-lyrics" id="viewerLyrics"></div>
  </div>

  <script>
    let hymns = [];
    let currentTab = 'all';
    let currentHymn = null;
    let fontSize = parseInt(localStorage.getItem('hymn_size') || '28', 10);
    let favorites = JSON.parse(localStorage.getItem('hymn_favs') || '[]');

    fetch('hymns.json?v=6')
      .then(res => res.json())
      .then(data => { hymns = data; render(); });

    function render() {
      const list = document.getElementById('hymnList');
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      list.innerHTML = '';
      const filtered = hymns.filter(h => {
        if (currentTab === 'fav' && !favorites.includes(Number(h.num))) return false;
        return !q || h.num.toString() === q || h.title.includes(q) || h.lyrics.includes(q);
      });
      filtered.forEach(h => {
        const item = document.createElement('div');
        item.className = 'hymn-card';
        item.innerHTML = `<div class="hymn-num">${h.num}장</div><div class="hymn-title">${h.title}</div><div class="star-icon ${favorites.includes(Number(h.num))?'active':''}">★</div>`;
        item.onclick = () => openViewer(h);
        list.appendChild(item);
      });
    }

    function formatLyricsHTML(text) {
      if (!text) return '';
      const lines = text.split('\n');
      let formattedHTML = '';
      let inChorus = false;
      lines.forEach(line => {
        let trimmed = line.trim();
        if (!trimmed) return;
        const isNewVerse = /^\s*(\(\d+\)|\d+\.|\d+절)/.test(trimmed);
        const isChorusStart = /후렴/.test(trimmed);
        if (isNewVerse) inChorus = false;
        else if (isChorusStart) inChorus = true;
        let classNames = [];
        if (isNewVerse) classNames.push('verse-block');
        if (inChorus) classNames.push('chorus-text');
        formattedHTML += `<div class="${classNames.join(' ')}">${trimmed}</div>`;
      });
      return formattedHTML;
    }

    function openViewer(h) {
      if (!h) return;
      currentHymn = h;
      document.getElementById('viewerTitle').innerText = `${h.num}장 ${h.title}`;
      const lb = document.getElementById('viewerLyrics');
      lb.innerHTML = formatLyricsHTML(h.lyrics);
      lb.style.fontSize = fontSize + 'px';
      lb.scrollTop = 0;
      
      // 전환 효과 적용
      lb.classList.remove('fade-in');
      void lb.offsetWidth; // 리플로우 강제 발생
      lb.classList.add('fade-in');

      document.getElementById('viewerStar').style.color = favorites.includes(Number(h.num)) ? '#f59e0b' : 'inherit';
      document.getElementById('viewer').style.display = 'flex';
    }

    function closeViewer() { document.getElementById('viewer').style.display = 'none'; render(); }
    
    function toggleFavCurrent() {
      const num = Number(currentHymn.num);
      const idx = favorites.indexOf(num);
      if (idx > -1) favorites.splice(idx, 1); else favorites.push(num);
      localStorage.setItem('hymn_favs', JSON.stringify(favorites));
      document.getElementById('viewerStar').style.color = favorites.includes(num) ? '#f59e0b' : 'inherit';
    }
    
    function changeFontSize(val) {
      fontSize = Math.min(Math.max(18, fontSize + val), 48);
      document.getElementById('viewerLyrics').style.fontSize = fontSize + 'px';
      localStorage.setItem('hymn_size', fontSize);
    }
    function toggleTheme() { document.body.classList.toggle('light-mode'); }
    function changeTab(tab) {
      currentTab = tab;
      document.getElementById('tabAll').className = 'tab ' + (tab === 'all' ? 'active' : '');
      document.getElementById('tabFav').className = 'tab ' + (tab === 'fav' ? 'active' : '');
      render();
    }
    document.getElementById('searchInput').addEventListener('input', render);

    /* --- [스와이프 로직 강화] --- */
    let startX = 0;
    let startY = 0;
    const viewer = document.getElementById('viewer');

    viewer.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, { passive: true });

    viewer.addEventListener('touchend', (e) => {
      let endX = e.changedTouches[0].clientX;
      let endY = e.changedTouches[0].clientY;
      
      let diffX = endX - startX;
      let diffY = endY - startY;

      // 가로 이동이 세로 이동보다 크고, 40px 이상 밀었을 때만 작동
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
        let currentNum = Number(currentHymn.num);
        if (diffX < 0) { // 왼쪽으로 밀기 -> 다음 장
          let next = hymns.find(h => Number(h.num) === currentNum + 1);
          if (next) openViewer(next);
        } else { // 오른쪽으로 밀기 -> 이전 장
          let prev = hymns.find(h => Number(h.num) === currentNum - 1);
          if (prev) openViewer(prev);
        }
      }
    }, { passive: true });
  </script>
</body>
</html>
