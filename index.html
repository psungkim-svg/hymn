<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SK새찬송가</title>
  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2563eb" id="themeColorMeta">
  <meta name="color-scheme" content="light dark">
  <script>
    // 다크모드를 화면 그리기 전에 적용 → 실행 시 흰 화면 번쩍임 제거
    (function () {
      try {
        var dark = localStorage.getItem('hymn_dark') === '1';
        if (dark) {
          document.documentElement.classList.add('dark-mode');
          document.documentElement.style.background = '#121212';
        }
      } catch (e) {}
    })();
  </script>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SK새찬송가">
  <style>
    :root {
      --bg: #ffffff;
      --text: #191f28;
      --sub-text: #8b95a1;
      --card-bg: #f9fafb;
      --primary: #2563eb;
      --border: #e5e8eb;
      --star-color: #f59e0b;
    }
    .dark-mode, .dark-mode body {
      --bg: #121212;
      --text: #f3f4f6;
      --sub-text: #9ca3af;
      --card-bg: #1e1e1e;
      --primary: #60a5fa;
      --border: #2e2e2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard, sans-serif; }
    html { background: var(--bg); }
    body {
      background: var(--bg); color: var(--text); user-select: none;
      padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
    }
    button { font-family: inherit; }

    /* 상단 헤더 & 검색창 */
    header {
      position: sticky; top: 0; background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px; display: flex; gap: 8px; z-index: 100;
      padding-top: calc(12px + env(safe-area-inset-top));
    }
    .search-input {
      flex: 1; padding: 0 12px; height: 42px; border: 1px solid var(--border);
      border-radius: 10px; font-size: 21px; font-weight: 600; background: var(--card-bg);
      color: var(--text); outline: none; min-width: 0;
    }
    .search-input::placeholder { font-size: 14px; font-weight: normal; }
    /* 다크모드에서도 검색창은 흰색 바탕으로 고정 */
    .dark-mode .search-input {
      background: #ffffff; color: #191f28; border-color: #d1d5db;
    }
    .dark-mode .search-input::placeholder { color: #9ca3af; }
    .btn-icon {
      padding: 0 13px; height: 42px; background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 10px; font-size: 17px; cursor: pointer; color: var(--text); flex-shrink: 0;
    }

    /* 탭 메뉴 */
    .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg); }
    .tab {
      flex: 1; text-align: center; padding: 13px 0; font-size: 17px; font-weight: 800;
      color: var(--sub-text); cursor: pointer; white-space: nowrap; letter-spacing: -1px;
    }
    @media (max-width: 360px) { .tab { font-size: 15.5px; letter-spacing: -1.2px; } }
    /* 내 모드(탭 6개)에서도 글자 크기는 교인용 4개짜리와 똑같이 17px 유지.
       폭이 모자라면 줄이지 않고 좌우로 스크롤한다. */
    .tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs.tabs-6 .tab { flex: 1 0 auto; padding: 13px 6px; letter-spacing: -1.2px; }
    @media (max-width: 390px) { .tabs.tabs-6 .tab { padding: 13px 4px; letter-spacing: -1.4px; } }
    .tab.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
    /* 다크모드: 선택 안 된 탭은 흰색, 선택된 탭만 파랑 */
    .dark-mode .tab { color: #ffffff; }
    .dark-mode .tab.active { color: var(--primary); }

    /* 리스트 */
    .list-view {
      padding: 6px 0; overflow-y: auto;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      max-height: calc(100vh - 106px - env(safe-area-inset-top));
      max-height: calc(100dvh - 106px - env(safe-area-inset-top));
    }
    .hymn-card {
      display: flex; align-items: center; padding: 4px 20px;
      border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .hymn-num { width: 55px; font-size: 17px; font-weight: bold; color: var(--primary); flex-shrink: 0; }
    .hymn-title { flex: 1; font-size: 21px; font-weight: 600; line-height: 1.25; }
    .star-icon {
      font-size: 22px; color: #d1d5db; padding: 10px 4px 10px 12px; margin: -10px -4px -10px 0;
      flex-shrink: 0; cursor: pointer; transition: transform .12s;
    }
    .star-icon:active { transform: scale(1.35); }
    .star-icon.active { color: var(--star-color); }
    .my-tag {
      display: inline-block; font-size: 12px; font-weight: 500; color: var(--primary);
      border: 1px solid var(--primary); border-radius: 10px; padding: 1px 8px;
      margin-left: 8px; vertical-align: middle; flex-shrink: 0; white-space: nowrap;
    }
    .hl { background: #ffe58a; border-radius: 3px; padding: 0 1px; color: #191f28; }
    .dark-mode .hl { background: #7c6a11; color: #fff; }

    /* 최근 본 곡 */
    .recent-row {
      display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto;
      border-bottom: 1px solid var(--border); align-items: center;
      -webkit-overflow-scrolling: touch;
    }
    .recent-row::-webkit-scrollbar { display: none; }
    .recent-label { font-size: 13px; color: var(--sub-text); flex-shrink: 0; font-weight: bold; }
    .recent-chip {
      flex-shrink: 0; background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 18px; padding: 7px 13px; font-size: 13px; cursor: pointer;
      white-space: nowrap; color: var(--text);
    }
    .recent-chip b { color: var(--primary); margin-right: 4px; }

    /* 분류 메뉴 */
    .cat-card {
      display: flex; align-items: center; gap: 12px; padding: 4px 20px;
      border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .cat-icon {
      width: 32px; height: 32px; border-radius: 9px; background: var(--card-bg);
      border: 1px solid var(--border); display: flex; align-items: center;
      justify-content: center; font-size: 16px; flex-shrink: 0;
    }
    .cat-name { flex: 1; font-size: 21px; font-weight: 600; line-height: 1.25; }
    .cat-range { font-size: 13px; color: var(--sub-text); white-space: nowrap; }
    .cat-arrow { color: var(--sub-text); font-size: 20px; }

    .cat-header {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      border-bottom: 1px solid var(--border); background: var(--bg);
    }
    .cat-back {
      padding: 7px 12px; border: 1px solid var(--border); background: var(--card-bg);
      color: var(--text); border-radius: 8px; font-size: 14px; cursor: pointer; white-space: nowrap;
    }
    .cat-cur { display: flex; align-items: baseline; gap: 8px; overflow: hidden; }
    .cat-cur b { font-size: 17px; white-space: nowrap; }
    .cat-cur span { font-size: 13px; color: var(--sub-text); white-space: nowrap; }

    .chip-row {
      display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto;
      border-bottom: 1px solid var(--border); -webkit-overflow-scrolling: touch;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      padding: 7px 14px; border-radius: 18px; border: 1px solid var(--border);
      background: var(--card-bg); color: var(--text); font-size: 13px; font-weight: 500;
      white-space: nowrap; cursor: pointer; flex-shrink: 0;
    }
    .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* 예배 순서(플레이리스트) */
    .pl-song {
      display: flex; align-items: center; padding: 4px 16px;
      border-bottom: 1px solid var(--border); cursor: pointer; gap: 10px;
    }
    .pl-order {
      width: 26px; height: 26px; border-radius: 50%; background: var(--primary);
      color: #fff; font-size: 13px; font-weight: bold; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .pl-title { flex: 1; font-size: 21px; font-weight: 600; line-height: 1.25; min-width: 0; }
    .pl-title small { display: block; color: var(--sub-text); font-size: 12px; }
    .pl-ctrl {
      border: 1px solid var(--border); background: var(--card-bg); color: var(--text);
      width: 30px; height: 30px; border-radius: 7px; font-size: 13px; cursor: pointer;
      flex-shrink: 0; line-height: 1;
    }
    .pl-actions { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
    .pl-actions button {
      flex: 1; padding: 9px 0; border: 1px solid var(--border); background: var(--card-bg);
      color: var(--text); border-radius: 8px; font-size: 14px; cursor: pointer;
    }
    .pl-actions button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* 가사 뷰어 */
    #viewer {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      height: 100dvh;
      background: var(--bg); flex-direction: column; z-index: 200;
      padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
    }
    .viewer-header {
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
    }
    .viewer-title {
      font-size: 17px; font-weight: bold; max-width: 46%; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .font-btns { display: flex; gap: 5px; }
    .font-btns button {
      padding: 6px 9px; border: 1px solid var(--border); background: var(--card-bg);
      color: var(--text); border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    .viewer-tools {
      display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border);
      justify-content: flex-end; overflow-x: auto;
    }
    .viewer-tools::-webkit-scrollbar { display: none; }
    .viewer-tools button {
      padding: 7px 12px; border: 1px solid var(--border); background: var(--card-bg);
      color: var(--text); border-radius: 8px; font-size: 13.5px; font-weight: 500;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .viewer-tools button:active { background: var(--primary); color: #fff; }
    .next-bar {
      display: flex; align-items: center; gap: 10px; padding: 10px 16px;
      background: var(--card-bg); border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .next-bar b { color: var(--primary); }
    .next-bar span { flex: 1; font-size: 14px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .viewer-lyrics {
      flex: 1; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); overflow-y: auto; white-space: pre-wrap;
      line-height: 1.5; font-weight: 600; user-select: text; -webkit-user-select: text;
      /* 확대해도 글자가 화면 밖으로 안 나가고 자동으로 줄바꿈되어 정렬됨 */
      word-break: keep-all; overflow-wrap: break-word; hyphens: none;
      touch-action: pan-y; -webkit-text-size-adjust: 100%;
    }
    /* 절과 절 사이를 확실히 구분 (첫 줄 제외) */
    .viewer-lyrics .vs:not(:first-child) { margin-top: 1.2em; }
    /* 후렴 구간 색상: 일반모드 짙은 노랑 / 다크모드 노랑 */
    .viewer-lyrics .refrain { color: #b8860b; }
    .dark-mode .viewer-lyrics .refrain { color: #ffd60a; }

    /* 스와이프 넘김 애니메이션 */
    @keyframes slideInNext { from { transform: translateX(46px); opacity: .25; } to { transform: none; opacity: 1; } }
    @keyframes slideInPrev { from { transform: translateX(-46px); opacity: .25; } to { transform: none; opacity: 1; } }
    .anim-next { animation: slideInNext .22s ease-out; }
    .anim-prev { animation: slideInPrev .22s ease-out; }

    /* 프로젝터 모드 */
    #projector {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      height: 100dvh;
      background: var(--bg); z-index: 400; flex-direction: column;
      padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
    }
    .proj-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      border-bottom: 1px solid var(--border);
    }
    .proj-top .title { font-size: 15px; font-weight: bold; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .proj-top .count { font-size: 14px; color: var(--sub-text); font-weight: bold; }
    .proj-slide {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 30px 26px; text-align: center; cursor: pointer; overflow-y: auto;
      touch-action: pan-y;
    }
    .proj-text {
      line-height: 1.55; font-weight: 600;
      white-space: pre-wrap; user-select: none; -webkit-user-select: none;
      word-break: keep-all; overflow-wrap: break-word;
    }
    .proj-dots {
      display: flex; gap: 7px; justify-content: center;
      padding: 14px 0 calc(20px + env(safe-area-inset-bottom));
    }
    .proj-dot {
      width: 9px; height: 9px; border-radius: 50%; background: var(--border); cursor: pointer;
    }
    .proj-dot.active { background: var(--primary); width: 24px; border-radius: 5px; }

    /* 설정 맨 위 '내 모드' 상태 줄 */
    .owner-row {
      display: flex; align-items: center; gap: 10px; margin: 0 0 14px;
      padding: 12px 14px; border-radius: 12px;
      background: #eef2ff; border: 2px solid var(--primary);
    }
    .dark-mode .owner-row { background: #1e2a4a; }
    .owner-row .owner-txt { flex: 1; font-size: 15px; color: var(--text); }
    .owner-row .owner-txt small { display: block; margin-top: 3px; font-size: 12.5px; color: var(--sub-text); font-weight: 500; }
    .owner-row .owner-off {
      border: 0; border-radius: 10px; padding: 9px 12px; cursor: pointer;
      background: var(--primary); color: #fff; font-size: 13px; font-weight: 800; line-height: 1.25;
    }

    /* 새 버전 알림 띠 */
    #updBar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 950;
      display: none; align-items: center; gap: 10px;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      background: #2563eb; color: #fff; font-size: 15px; font-weight: 700;
      box-shadow: 0 -4px 18px rgba(0,0,0,.22);
    }
    #updBar.on { display: flex; }
    #updBar .txt { flex: 1; line-height: 1.35; }
    #updBar .txt small { display: block; font-weight: 500; opacity: .85; font-size: 12.5px; }
    #updBar button {
      border: 0; border-radius: 9px; padding: 10px 14px; font-size: 14.5px;
      font-weight: 800; cursor: pointer; background: #fff; color: #1d4ed8;
    }
    #updBar button.later { background: rgba(255,255,255,.18); color: #fff; padding: 10px; }

    /* 두 손가락 확대 중 표시되는 배지 */
    #zoomBadge {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: rgba(17,17,17,.82); color: #fff; font-size: 19px; font-weight: 800;
      padding: 12px 20px; border-radius: 14px; z-index: 900; pointer-events: none;
      opacity: 0; transition: opacity .15s;
    }
    #zoomBadge.on { opacity: 1; }

    /* 모달 */
    #modalWrap {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.45); z-index: 500; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal {
      background: var(--bg); border-radius: 14px; padding: 20px 18px; width: 100%;
      max-width: 360px; max-height: 80vh; overflow-y: auto; border: 1px solid var(--border);
    }
    .modal h3 { font-size: 17px; margin-bottom: 14px; }
    .modal .m-row {
      display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px;
      border: 1px solid var(--border); border-radius: 9px; background: var(--card-bg);
      color: var(--text); font-size: 15px; cursor: pointer;
    }
    .modal .m-row small { color: var(--sub-text); }
    .modal textarea, .modal input[type=text] {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--card-bg); color: var(--text); font-size: 14px; outline: none;
      margin-bottom: 10px; user-select: text; -webkit-user-select: text;
    }
    .modal .m-btns { display: flex; gap: 8px; margin-top: 6px; }
    .modal .m-btns button {
      flex: 1; padding: 11px 0; border: none; border-radius: 9px; font-size: 15px;
      font-weight: bold; cursor: pointer;
    }
    .m-ok { background: var(--primary); color: #fff; }
    .m-cancel { background: var(--card-bg); color: var(--text); border: 1px solid var(--border) !important; }
    .m-note { font-size: 12.5px; color: var(--sub-text); line-height: 1.55; margin: 10px 0; }
    .m-sec { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 14px; }
    .m-sec-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; }

    /* 검색 결과 가사 스니펫 */
    .hymn-main { flex: 1; min-width: 0; }
    .hymn-snip {
      font-size: 13.5px; color: var(--sub-text); line-height: 1.4; margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* 번호 키패드 */
    .kp-display {
      text-align: center; padding: 10px 0 14px; border-bottom: 1px solid var(--border); margin-bottom: 12px;
    }
    .kp-num { font-size: 44px; font-weight: 800; color: var(--primary); line-height: 1.1; letter-spacing: 2px; }
    .kp-title { font-size: 15px; color: var(--sub-text); margin-top: 4px; height: 21px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .kp-grid button {
      padding: 15px 0; font-size: 24px; font-weight: 700; border: 1px solid var(--border);
      background: var(--card-bg); color: var(--text); border-radius: 11px; cursor: pointer;
    }
    .kp-grid button:active { background: var(--primary); color: #fff; }
    .kp-grid button.kp-go { background: var(--primary); color: #fff; border-color: var(--primary); font-size: 19px; }
    .kp-grid button.kp-go:disabled { opacity: .4; }

    /* 글자 크기 슬라이더 */
    .size-row { display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; }
    .size-row input[type=range] { flex: 1; accent-color: var(--primary); }
    .size-row .size-val { font-size: 13px; color: var(--sub-text); width: 44px; text-align: right; }
    .size-prev { font-weight: 600; line-height: 1.5; padding: 10px 12px; background: var(--card-bg);
      border: 1px solid var(--border); border-radius: 9px; margin-top: 8px; }

    /* 즐겨찾기 정렬 */
    .fav-bar { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); align-items: center; }
    .fav-bar .chip { flex-shrink: 0; }
    .fav-bar .spacer { flex: 1; }
    .drag-handle {
      font-size: 20px; color: var(--sub-text); padding: 0 10px 0 2px; cursor: grab;
      touch-action: none; flex-shrink: 0; user-select: none;
    }
    .hymn-card.dragging { opacity: .55; background: var(--card-bg); }
    .hymn-card.drop-target { border-top: 2px solid var(--primary); }

    /* 프로젝터: 글자크기 · 다음 곡 */
    .proj-fonts { display: flex; gap: 4px; flex-shrink: 0; }
    .proj-fonts button {
      padding: 5px 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text);
      border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
    }
    .proj-text { font-size: calc(clamp(1.9rem, 8.5vw, 4.2rem) * var(--proj-scale, 1)); }
    .proj-next {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 16px; margin: 0 14px; border-radius: 10px;
      background: var(--card-bg); border: 1px solid var(--primary); color: var(--primary);
      font-size: 14.5px; font-weight: bold; cursor: pointer;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }

    /* CCM */
    .ccm-badge {
      display: inline-block; font-size: 11px; font-weight: 800; color: #fff;
      background: #7c3aed; border-radius: 6px; padding: 2px 6px; letter-spacing: .3px;
    }
    .ccm-badge.mine { background: #059669; }
    .ccm-badge.en { background: #7c3aed; }
    .song-sub { font-size: 12.5px; color: var(--sub-text); margin-top: 2px; }
    .empty-box {
      padding: 26px 22px; color: var(--sub-text); font-size: 14px; line-height: 1.85; text-align: center;
    }

  </style>
</head>

      { icon:'🕊️', name:'성령강림', from:182, to:195, subs:[] },

      { icon:'📣', name:'전도와 선교', from:495, to:549, subs:[['전도',495,501],['세계선교',502,512],['전도와 교훈',513,518],['부르심과 영접',519,539],['믿음과 확신',540,549]] },
      { icon:'🎉', name:'행사와 절기', from:550, to:594, subs:[['새해(송구영신)',550,554],['가정',555,559],['어린이',560,570],['젊은이',571,575],['어버이',576,579],['나라사랑',580,584],['종교개혁기념일',585,586],['감사절',587,594]] },
      { icon:'💒', name:'예식', from:595, to:613, subs:[['임직',595,597],['헌당',598,600],['혼례',601,605],['장례',606,610],['추모',611,613]] },
      { icon:'🎶', name:'경배와 찬양', from:614, to:624, subs:[] },
      { icon:'🕊️', name:'영창과 기도송', from:625, to:645, subs:[['입례송',625,629],['기도송',630,632],['헌금응답송',633,634],['주기도송',635,636],['말씀응답송',637,637],['축도송',638,639],['아멘송',640,645]] },
    ];

    const $ = id => document.getElementById(id);

    // ================== 곡 공통 처리 (찬송가 + CCM) ==================
    // 찬송가는 번호(숫자), CCM은 문자열 id를 "키"로 쓴다
    const keyOf = s => (s.book === 'hymn' ? s.num : s.id);
    const saveMyCcms = () => localStorage.setItem('hymn_myccm', JSON.stringify(myCcms));

    function findSong(k) {
      if (k === null || k === undefined) return null;
      return songIndex.get(k) || songIndex.get(Number(k)) || songIndex.get(String(k)) || null;
    }
    function rebuildIndex() {
      songIndex = new Map();
      hymns.forEach(h => { h.book = 'hymn'; songIndex.set(h.num, h); });
      ccmAll = ccms.concat(myCcms).sort((a, b) => a.title.localeCompare(b.title, 'ko'));
      ccmAll.forEach((c, i) => { c.book = 'ccm'; c.no = i + 1; songIndex.set(c.id, c); });
      enAll = ens.slice().sort((a, b) => a.title.localeCompare(b.title, 'en'));
      enAll.forEach((c, i) => { c.book = 'en'; c.no = i + 1; songIndex.set(c.id, c); });
      if (hymns.length) maxHymnNum = Math.max(...hymns.map(h => h.num));
      buildSearchIndex();
    }
    const songLabel = s => (
      s.book === 'hymn' ? s.num + '장'
      : s.book === 'en' ? '<span class="ccm-badge en">ENG</span>'
      : '<span class="ccm-badge' + (s.mine ? ' mine' : '') + '">CCM</span>');
    const songTitleFull = s => (s.book === 'hymn' ? s.num + '장 ' + s.title : s.title);
    function allCcmTags() {
      const t = new Set();
      ccmAll.forEach(c => (c.tags || []).forEach(x => t.add(x)));
      return [...t].sort((a, b) => a.localeCompare(b, 'ko'));
    }
    function allEnTags() {
      const t = new Set();
      enAll.forEach(c => (c.tags || []).forEach(x => t.add(x)));
      return [...t].sort((a, b) => a.localeCompare(b, 'ko'));
    }

    // ================== 화면 이동 (스마트폰 뒤로가기 연동) ==================
    history.replaceState(view, '');
    window.addEventListener('popstate', e => {
      view = (e.state && e.state.screen) ? e.state : { screen: 'home', tab: 'all' };
      applyView();
    });

    function go(v, replace) {
      view = v;
      if (replace) history.replaceState(v, '');
      else history.pushState(v, '');
      applyView();
    }

    function applyView() {
      closeModal();
      if (view.screen === 'viewer') {
        const h = findSong(view.num);
        if (h) {
          showViewer(h);
          if (view.proj) openProjector(h); else closeProjector();
          return;
        }
        view = { screen: 'home', tab: 'all' };
      }
      closeProjector();
      $('viewer').style.display = 'none';

      const activeTab = view.tab;
      applyOwnerTabs();
      $('tabAll').className  = 'tab ' + (activeTab === 'all'  ? 'active' : '');
      $('tabCcm').className  = 'tab ' + (activeTab === 'ccm'  ? 'active' : '');
      $('tabEn').className   = 'tab ' + (activeTab === 'en'   ? 'active' : '');
      $('tabFav').className  = 'tab ' + (activeTab === 'fav'  ? 'active' : '');
      $('tabCat').className  = 'tab ' + (activeTab === 'cat'  ? 'active' : '');
      $('tabList').className = 'tab ' + (activeTab === 'list' ? 'active' : '');

      if (view.screen === 'entag') renderEnTagView();
      else if (view.screen === 'ccmtag') renderCcmTagView();
      else if (view.screen === 'category') renderCategory();
      else if (view.screen === 'playlist' || view.screen === 'customcat') renderPlaylistDetail(view.id);
      else renderHome();
    }
    // =========================================================================

    // 데이터 로드 (ccm.json / en.json 은 없어도 정상 동작)
    // ※ 내 모드가 꺼져 있으면 CCM·영어 파일을 아예 읽지 않는다 → 교회 배포본과 동일한 화면
    const loadExtra = (file) => (ownerMode
      ? fetch(file).then(r => (r.ok ? r.json() : [])).catch(() => [])
      : Promise.resolve([]));
    Promise.all([
      fetch('hymns.json').then(r => r.json()),
      loadExtra('ccm.json'),
      loadExtra('en.json')
    ]).then(([h, c, e]) => {
      hymns = h;
      ccms = (Array.isArray(c) ? c : []).map((x, i) => ({
        id: x.id || ('ccm-' + String(i + 1).padStart(3, '0')),
        title: x.title || '(제목 없음)',
        lyrics: x.lyrics || '',
        tags: Array.isArray(x.tags) ? x.tags : [],
        artist: x.artist || '', key: x.key || '', youtube: x.youtube || ''
      }));
      ens = (Array.isArray(e) ? e : []).map((x, i) => ({
        id: x.id || ('en-' + String(i + 1).padStart(3, '0')),
        title: x.title || '(no title)',
        lyrics: x.lyrics || '',
        tags: Array.isArray(x.tags) ? x.tags : [],
        artist: x.artist || '', key: x.key || '', youtube: x.youtube || '',
        hymnNum: x.hymnNum || 0
      }));
      rebuildIndex();
      applyView();
    }).catch(() => alert('hymns.json 파일을 불러오지 못했습니다. 같은 폴더에 있는지 확인해주세요.'));

    // ================== 검색 (번호/제목/가사/초성) ==================
    const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
    function toChosung(s) {
      let out = '';
      for (const c of s) {
        const code = c.charCodeAt(0);
        out += (code >= 0xAC00 && code <= 0xD7A3) ? CHO[Math.floor((code - 0xAC00) / 588)] : c;
      }
      return out;
    }
    function isChosungQuery(q) { return /^[ㄱ-ㅎ\s]+$/.test(q) && q.replace(/\s/g, '').length > 0; }

    // 초성 검색용 색인을 로드 직후 한 번만 만들어 둔다 (검색할 때마다 변환하면 느림)
    function buildSearchIndex() {
      for (const h of hymns.concat(ccmAll, enAll)) {
        h._t = h.title.toLowerCase();
        h._l = (h.lyrics || '').toLowerCase();
        // 띄어쓰기·문장부호를 뺀 사본 — "주사랑안에"로도 "주 사랑 안에"를 찾게 해준다
        h._ts = h._t.replace(/[\s.,!?'"~\-·()]/g, '');
        h._ls = h._l.replace(/[\s.,!?'"~\-·()]/g, '');
        h._ct = toChosung(h.title).replace(/\s/g, '');
        h._cl = toChosung(h.lyrics || '').replace(/\s/g, '');
      }
    }

    // 검색어에서 띄어쓰기·문장부호 제거
    const squash = t => (t || '').replace(/[\s.,!?'"~\-·()]/g, '');
    function matchQ(h, q) {
      if (!q) return true;
      if (isChosungQuery(q)) {
        const c = q.replace(/\s/g, '');
        return (h._ct || '').includes(c) || (h._cl || '').includes(c);
      }
      if ((h.num != null && h.num.toString() === q) ||
          (h._t || h.title.toLowerCase()).includes(q) ||
          (h._l || (h.lyrics || '').toLowerCase()).includes(q)) return true;
      // 띄어쓰기가 달라도 찾기
      const qs = squash(q);
      if (qs.length < 2) return false;
      return (h._ts || squash(h._t || h.title.toLowerCase())).includes(qs) ||
             (h._ls || squash(h._l || (h.lyrics || '').toLowerCase())).includes(qs);
    }
    // 띄어쓰기를 무시하고 찾기 위한 정규식 (글자 사이에 공백·부호가 끼어도 매치)
    function flexRe(q) {
      const chars = squash(q).split('');
      if (!chars.length) return null;
      const body = chars.map(c => c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('[\\s.,!?\'"~\\-·()]*');
      try { return new RegExp(body, 'gi'); } catch (e) { return null; }
    }

    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function hlTitle(title, q) {
      if (!q || isChosungQuery(q)) return esc(title);
      const idx = title.toLowerCase().indexOf(q);
      if (idx >= 0) {
        return esc(title.slice(0, idx)) +
               '<span class="hl">' + esc(title.slice(idx, idx + q.length)) + '</span>' +
               esc(title.slice(idx + q.length));
      }
      return hlFlex(title, q);
    }
    // 띄어쓰기가 달라도 찾은 부분에 색을 입힌다
    function hlFlex(text, q) {
      const re = flexRe(q);
      if (!re) return esc(text);
      let out = '', last = 0, m, guard = 0;
      while ((m = re.exec(text)) !== null && guard++ < 200) {
        if (m[0] === '') { re.lastIndex++; continue; }
        out += esc(text.slice(last, m.index)) + '<span class="hl">' + esc(m[0]) + '</span>';
        last = m.index + m[0].length;
      }
      if (!last) return esc(text);
      return out + esc(text.slice(last));
    }

    // 가사 검색 스니펫: 검색어가 들어간 가사 줄을 잘라서 하이라이트
    function hlAll(text, q) {
      if (!q) return esc(text);
      if (!text.toLowerCase().includes(q)) return hlFlex(text, q);
      let out = '', low = text.toLowerCase(), i = 0;
      while (true) {
        const j = low.indexOf(q, i);
        if (j < 0) { out += esc(text.slice(i)); break; }
        out += esc(text.slice(i, j)) + '<span class="hl">' + esc(text.slice(j, j + q.length)) + '</span>';
        i = j + q.length;
      }
      return out;
    }
    function snippetOf(h, q) {
      if (!q || isChosungQuery(q) || /^\d+$/.test(q)) return '';
      if (h.title.toLowerCase().includes(q)) return '';
      const qs = squash(q);
      if (squash(h.title.toLowerCase()).includes(qs)) return '';
      const lines = (h.lyrics || '').split('\n');
      let line = lines.find(l => l.toLowerCase().includes(q));
      if (!line) line = lines.find(l => squash(l.toLowerCase()).includes(qs));
      if (!line) return '';
      let t = line.trim().replace(/^\((?:\d+|후렴[^)]*)\)\s*/, '');
      let pos = t.toLowerCase().indexOf(q);
      if (pos < 0) { const m = flexRe(q); const mm = m ? m.exec(t) : null; pos = mm ? mm.index : 0; }
      let pre = '';
      if (pos > 14) { t = t.slice(pos - 12); pre = '…'; }
      if (t.length > 46) t = t.slice(0, 46) + '…';
      return '🎵 ' + pre + hlAll(t, q);
    }

    // ---- 드래그로 순서 바꾸기 (터치 + 마우스) ----
    function attachDrag(row) {
      const handle = row.querySelector('[data-handle]');
      if (!handle) return;
      handle.addEventListener('pointerdown', ev => {
        ev.preventDefault();
        const parent = row.parentNode;
        row.classList.add('dragging');
        handle.setPointerCapture(ev.pointerId);
        const move = e => {
          const rows = [...parent.querySelectorAll('.hymn-card')];
          for (const r of rows) {
            if (r === row) continue;
            const b = r.getBoundingClientRect();
            if (e.clientY > b.top && e.clientY < b.bottom) {
              const after = e.clientY > b.top + b.height / 2;
              parent.insertBefore(row, after ? r.nextSibling : r);
              break;
            }
          }
        };
        const up = () => {
          handle.releasePointerCapture(ev.pointerId);
          handle.removeEventListener('pointermove', move);
          handle.removeEventListener('pointerup', up);
          handle.removeEventListener('pointercancel', up);
          row.classList.remove('dragging');
          favorites = [...parent.querySelectorAll('.hymn-card')].map(r => {
            const v = r.dataset.num;
            return /^\d+$/.test(v) ? parseInt(v, 10) : v;
          });
          saveFavs();
          showToast('순서를 저장했습니다');
        };
        handle.addEventListener('pointermove', move);
        handle.addEventListener('pointerup', up);
        handle.addEventListener('pointercancel', up);
      });
    }

      closeModal();
      const nm = si >= 0 ? CATEGORIES[ci].subs[si][0] : CATEGORIES[ci].name;
      showToast(`'${nm}'에 ${currentHymn.num}장 추가됨`);
    }

    // ================== 예배 순서 / 내 분류 (사용자 그룹) ==================
    const saveLists = () => localStorage.setItem('hymn_lists', JSON.stringify(playlists));
    const saveCats  = () => localStorage.setItem('hymn_cats', JSON.stringify(customCats));
    const getStore  = kind => (kind === 'cat' ? customCats : playlists);
    const saveStore = kind => (kind === 'cat' ? saveCats() : saveLists());
    const getList   = (kind, id) => getStore(kind).find(p => p.id === id);
    const kindOf    = () => (view.screen === 'customcat' ? 'cat' : 'pl');

    function renderPlaylistTab(list) {
      const wrap = document.createElement('div');
      wrap.className = 'pl-actions';
      wrap.innerHTML = `<button class="primary" onclick="promptNew('pl')">＋ 새 예배 순서 만들기</button>`;
      list.appendChild(wrap);

      if (playlists.length === 0) {
        list.innerHTML += '<div style="text-align:center; padding: 40px 20px; color: var(--sub-text); line-height:1.7;">저장된 예배 순서가 없습니다.<br>찬송가를 연 뒤 <b>＋ 순서</b> 버튼으로<br>곡을 추가할 수 있어요.</div>';
        return;
      }
      playlists.forEach(p => {
        const div = document.createElement('div');
        div.className = 'cat-card';
        div.innerHTML = `
          <div class="cat-icon">📋</div>
          <div class="cat-name">${esc(p.name)}</div>
          <div class="cat-range">${p.nums.length}곡</div>
          <div class="cat-arrow">›</div>
        `;
        div.onclick = () => go({ screen: 'playlist', tab: 'list', id: p.id });
        list.appendChild(div);
      });
    }

    function renderPlaylistDetail(id) {
      const list = $('hymnList');
      const kind = kindOf();
      const p = getList(kind, id);
      list.innerHTML = '';
      if (!p) { view.tab = (kind === 'cat' ? 'cat' : 'list'); renderHome(); return; }

      const bar = document.createElement('div');
      bar.className = 'cat-header';
      bar.innerHTML = `
        <button class="cat-back" onclick="history.back()">‹ 목록</button>
        <div class="cat-cur"><b>${kind === 'cat' ? '✏️' : '📋'} ${esc(p.name)}</b><span>${p.nums.length}곡</span></div>
      `;
      list.appendChild(bar);

      const actions = document.createElement('div');
      actions.className = 'pl-actions';
      actions.innerHTML = `
        <button class="primary" onclick="plStart('${kind}','${id}')">▶ 이 순서로 보기</button>
        <button onclick="plRename('${kind}','${id}')">✏️ 이름변경</button>
        <button id="plDelBtn" onclick="plDelete('${kind}','${id}')">${pendingDelete ? '❗ 정말 삭제?' : '🗑 삭제'}</button>
      `;
      list.appendChild(actions);

      if (p.nums.length === 0) {
        list.innerHTML += `<div style="text-align:center; padding: 40px 20px; color: var(--sub-text);">아직 곡이 없습니다.<br>찬송가를 연 뒤 <b>＋ 순서</b>에서 이 ${kind === 'cat' ? '분류' : '순서'}를 선택하세요.</div>`;
        return;
      }
      p.nums.forEach((num, idx) => {
        const h = findSong(num);
        const row = document.createElement('div');
        row.className = 'pl-song';
        row.innerHTML = `
          <div class="pl-order">${idx + 1}</div>
          <div class="pl-title">${h ? esc(songTitleFull(h)) : esc(String(num))}<small>${h ? (h.book === 'ccm' ? 'CCM' : '') : '（데이터 없음）'}</small></div>
          <button class="pl-ctrl" onclick="event.stopPropagation(); plMove('${kind}','${id}',${idx},-1)">▲</button>
          <button class="pl-ctrl" onclick="event.stopPropagation(); plMove('${kind}','${id}',${idx},1)">▼</button>
          <button class="pl-ctrl" onclick="event.stopPropagation(); plRemove('${kind}','${id}',${idx})">✕</button>
        `;
        row.onclick = () => plOpen(kind, id, idx);
        list.appendChild(row);
      });
    }

    function promptNew(kind, afterCreate) {
      promptModal(kind === 'cat' ? '새 내 분류 만들기' : '새 예배 순서 만들기',
                  kind === 'cat' ? '예: 우리교회 특송곡' : '예: 주일 오전 예배',
        name => {
          if (!name.trim()) return;
          const p = { id: 'g' + Date.now() + (kind === 'cat' ? 'c' : 'p'), name: name.trim(), nums: [] };
          getStore(kind).unshift(p);
          saveStore(kind);
          if (afterCreate) afterCreate(kind, p.id);
          else { showToast("'" + p.name + "' 생성됨"); renderHome(); }
        });
    }

    function plOpen(kind, id, idx) {
      const p = getList(kind, id);
      if (!p || !p.nums[idx]) return;
      openHymn(p.nums[idx], { kind, id, idx });
    }
    function plStart(kind, id) { plOpen(kind, id, 0); }
    function plMove(kind, id, idx, dir) {
      const p = getList(kind, id); if (!p) return;
      const j = idx + dir;
      if (j < 0 || j >= p.nums.length) return;
      [p.nums[idx], p.nums[j]] = [p.nums[j], p.nums[idx]];
      saveStore(kind); renderPlaylistDetail(id);
    }
    function plRemove(kind, id, idx) {
      const p = getList(kind, id); if (!p) return;
      p.nums.splice(idx, 1);
      saveStore(kind); renderPlaylistDetail(id);
    }
    function plRename(kind, id) {
      const p = getList(kind, id); if (!p) return;
      promptModal('이름 변경', '', name => {
        if (!name.trim()) return;
        p.name = name.trim(); saveStore(kind); renderPlaylistDetail(id); showToast('이름을 변경했습니다');
      }, p.name);
    }
    function plDelete(kind, id) {
      if (!pendingDelete) { pendingDelete = true; renderPlaylistDetail(id); setTimeout(() => { pendingDelete = false; const b = $('plDelBtn'); if (b) b.textContent = '🗑 삭제'; }, 2500); return; }
      pendingDelete = false;
      if (kind === 'cat') customCats = customCats.filter(p => p.id !== id);
      else playlists = playlists.filter(p => p.id !== id);
      saveStore(kind); history.back();
    }

    function addToPlaylistModal() {
      if (!currentHymn) return;
      const isH = currentHymn.book === 'hymn';
      let html = `<h3>＋ ${esc(songTitleFull(currentHymn))}<br><span style="font-size:13px;color:var(--sub-text);font-weight:400;">어디에 추가할까요?</span></h3>`;
      html += `<div class="m-sec-title">📋 예배 순서</div>`;
      html += `<button class="m-row" onclick="promptNew('pl', addThenClose)">➕ <b>새 예배 순서 만들기</b></button>`;
      playlists.forEach(p => {
        html += `<button class="m-row" onclick="addToList('pl','${p.id}')">📋 ${esc(p.name)} <small>· ${p.nums.length}곡</small></button>`;
      });
      html += `<div class="m-sec"><div class="m-sec-title">✏️ 내 분류</div>`;
      html += `<button class="m-row" onclick="promptNew('cat', addThenClose)">➕ <b>새 분류 만들기</b></button>`;
      customCats.forEach(p => {
        html += `<button class="m-row" onclick="addToList('cat','${p.id}')">✏️ ${esc(p.name)} <small>· ${p.nums.length}곡</small></button>`;
      });
      html += `</div>`;
      if (isH) {
        html += `<div class="m-sec"><div class="m-sec-title">📂 공식 분류에 추가 (겹쳐도 OK)</div>`;
        CATEGORIES.forEach((c, ci) => {
          const targets = c.subs.length
            ? c.subs.map((sb, si) => [ci, si, sb[0], sb[1], sb[2]])
            : [[ci, -1, c.name, c.from, c.to]];
          targets.forEach(([tci, tsi, nm, f, t]) => {
            const added = (catExtras[catKeyOf(tci, tsi)] || []).includes(currentHymn.num);
            html += `<button class="m-row" onclick="addExtraFromViewer(${tci},${tsi})">${added ? '✅' : '📂'} ${esc(nm)} <small>· ${f}–${t}장${added ? ' · 추가됨' : ''}</small></button>`;
          });
        });
        html += `</div>`;
      }
      openModal(html);
    }
    function addToList(kind, id) {
      if (!currentHymn) return;
      const p = getList(kind, id); if (!p) return;
      p.nums.push(keyOf(currentHymn));
      saveStore(kind); closeModal();
      showToast(`'${p.name}'에 ${songTitleFull(currentHymn)} 추가됨`);
    }
    function addThenClose(kind, id) {
      if (!currentHymn) return;
      const p = getList(kind, id); if (!p) return;
      p.nums.push(keyOf(currentHymn));
      saveStore(kind); closeModal();
      showToast(`'${p.name}' 생성 · ${songTitleFull(currentHymn)} 추가됨`);
    }

    function openNextInList() {
      if (!playlistCtx) return;
      const p = getList(playlistCtx.kind || 'pl', playlistCtx.id);
      if (!p) return;
      const idx = playlistCtx.idx + 1;
      if (idx >= p.nums.length) return;
      openHymn(p.nums[idx], { kind: playlistCtx.kind || 'pl', id: p.id, idx });
    }

    // ================== 뷰어 ==================
    function openHymn(num, ctx) {
      playlistCtx = ctx || null;
      pushRecent(num);
      go({ screen: 'viewer', tab: view.tab, num });
    }

    function showViewer(h) {
      currentHymn = h;
      $('viewerTitle').innerText = songTitleFull(h);
      const lyricsBox = $('viewerLyrics');
      lyricsBox.innerHTML = renderLyrics(h.lyrics || '');
      lyricsBox.style.fontSize = fontSize + 'px';
      $('btnEditCcm').style.display = h.mine ? '' : 'none';
      updateViewerStar();
      updateNextBar();
      $('viewer').style.display = 'flex';
    }

    function updateNextBar() {
      const bar = $('nextBar');
      if (!playlistCtx) { bar.style.display = 'none'; return; }
      const p = getList(playlistCtx.kind || 'pl', playlistCtx.id);
      if (!p) { bar.style.display = 'none'; return; }
      const idx = playlistCtx.idx;
      if (idx + 1 >= p.nums.length) {
        bar.style.display = 'flex';
        bar.innerHTML = `<span>✔ 순서 마지막 곡입니다 (${esc(p.name)} · ${p.nums.length}곡)</span>`;
        return;
      }
      const next = findSong(p.nums[idx + 1]);
      bar.style.display = 'flex';
      bar.innerHTML = `<b>⏭ 다음</b><span>${idx + 2}/${p.nums.length} · ${next ? esc(songTitleFull(next)) : ''}</span><b>›</b>`;
    }

    function pushRecent(num) {
      recents = [num, ...recents.filter(n => n !== num)].slice(0, 12);
      localStorage.setItem('hymn_recent', JSON.stringify(recents));
    }

    // 가사를 HTML로 변환: 후렴 구간(후렴~다음 절 시작 전)에 색상 적용
    function renderLyrics(lyrics) {
      let inRef = false;
      return lyrics.split('\n').map(line => {
        const t = line.trim();
        const isVerse = /^\(\d+\)/.test(t);
        if (t.startsWith('(후렴')) inRef = true;
        else if (isVerse) inRef = false;
        let cls = isVerse ? 'vs' : '';
        if (inRef) cls += ' refrain';
        return `<div class="${cls}">${esc(line)}</div>`;
      }).join('');
    }

    // ================== 프로젝터 모드 ==================
    let projSecs = [], projIdx = 0;

    function enterProjector() {
      if (!currentHymn) return;
      go({ screen: 'viewer', tab: view.tab, num: keyOf(currentHymn), proj: 1 });
    }

    function splitSections(lyrics) {
      const secs = []; let cur = [];
      for (const line of lyrics.split('\n')) {
        if (/^\(\d+\)|^\(후렴/.test(line.trim())) {
          if (cur.some(x => x.trim())) secs.push(cur);
          cur = [line.trim()];
        } else cur.push(line);
      }
      if (cur.some(x => x.trim())) secs.push(cur);
      return secs.map(s => s.join('\n'));
    }

    let projEnterAtEnd = false;
    function openProjector(h) {
      projSecs = splitSections(h.lyrics);
      if (projSecs.length === 0) projSecs = [h.lyrics];
      projIdx = projEnterAtEnd ? projSecs.length - 1 : 0;
      projEnterAtEnd = false;
      $('projTitle').innerText = songTitleFull(h);
      renderProj();
      $('projector').style.display = 'flex';
      keepAwake(true);
    }
    function closeProjector() {
      if ($('projector').style.display === 'flex') {
        $('projector').style.display = 'none';
        keepAwake(false);
      }
    }
    function renderProj() {
      $('projSlide').innerHTML = `<div class="proj-text">${esc(projSecs[projIdx])}</div>`;
      $('projCount').innerText = `${projIdx + 1} / ${projSecs.length}`;
      $('projDots').innerHTML = projSecs.map((_, i) =>
        `<div class="proj-dot ${i === projIdx ? 'active' : ''}" onclick="projGo(${i})"></div>`).join('');

      // 예배 순서로 보는 중이면 마지막 절에서 '다음 곡' 안내
      const bar = $('projNext');
      const nx = nextInCtx(1);
      if (nx && projIdx === projSecs.length - 1) {
        bar.style.display = 'flex';
        bar.innerHTML = `⏭ 다음 곡 · ${esc(songTitleFull(nx.h))}`;
      } else bar.style.display = 'none';
    }

    // 예배 순서 기준 앞/뒤 곡 찾기
    function nextInCtx(dir) {
      if (!playlistCtx) return null;
      const p = getList(playlistCtx.kind || 'pl', playlistCtx.id);
      if (!p) return null;
      const idx = playlistCtx.idx + dir;
      if (idx < 0 || idx >= p.nums.length) return null;
      const h = findSong(p.nums[idx]);
      return h ? { h, idx, p } : null;
    }

    // 프로젝터에서 순서상 다음(또는 이전) 곡으로 이어가기
    function projNextSong(dir) {
      dir = dir || 1;
      const nx = nextInCtx(dir);
      if (!nx) { if (dir > 0) showToast('✔ 순서의 마지막 곡입니다'); return false; }
      playlistCtx = { kind: playlistCtx.kind || 'pl', id: nx.p.id, idx: nx.idx };
      pushRecent(keyOf(nx.h));
      projEnterAtEnd = (dir < 0);
      go({ screen: 'viewer', tab: view.tab, num: keyOf(nx.h), proj: 1 }, true);
      showToast(`${dir > 0 ? '⏭' : '⏮'} ${songTitleFull(nx.h)}`);
      return true;
    }
    function projTap(e) {
      if (pinching) return;                      // 확대 중 손가락 뗄 때 나오는 클릭 무시
      if (pSwiped) { pSwiped = false; return; }   // 스와이프 직후에 따라오는 클릭은 무시
      const x = e.clientX || 0;
      if (x < window.innerWidth * 0.3) projGo(projIdx - 1);
      else projGo(projIdx + 1);
    }
    function projGo(i) {
      // 마지막 절에서 더 넘기면 예배 순서상 다음 곡으로 자동 연결
      if (i > projSecs.length - 1) { if (projNextSong(1)) return; }
      if (i < 0) { if (nextInCtx(-1) && projNextSong(-1)) return; }
      const n = Math.min(Math.max(0, i), projSecs.length - 1);
      const dir = n > projIdx ? 1 : (n < projIdx ? -1 : 0);
      projIdx = n;
      renderProj();
      if (dir) animEl($('projSlide'), dir);
    }

    // ================== 스와이프: 프로젝터 모드에서 절 넘기기 ==================
    let pTsX = 0, pTsY = 0, pTsT = 0, pSwiped = false;
    $('projSlide').addEventListener('touchstart', e => {
      if (e.touches.length > 1) { pTsT = 0; pSwiped = true; return; }   // 두 손가락(확대) 중이면 넘김 무시
      pTsX = e.touches[0].clientX; pTsY = e.touches[0].clientY; pTsT = Date.now(); pSwiped = false;
    }, { passive: true });
    $('projSlide').addEventListener('touchend', e => {
      if (!pTsT || pinching) return;
      const dx = e.changedTouches[0].clientX - pTsX;
      const dy = e.changedTouches[0].clientY - pTsY;
      if (Date.now() - pTsT > 600) return;
      if (Math.abs(dx) >= 40 && Math.abs(dx) > Math.abs(dy) * 1.3) {
        pSwiped = true;
        projGo(projIdx + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });

    // 화면 꺼짐 방지 (Wake Lock)
    let wakeLock = null;
    async function keepAwake(on) {
      try {
        if (on && 'wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        } else if (!on && wakeLock) {
          await wakeLock.release(); wakeLock = null;
        }
      } catch (e) { /* 지원하지 않는 브라우저는 무시 */ }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && $('projector').style.display === 'flex') keepAwake(true);
    });

    // ================== 복사 / 공유 ==================
    function getLyricsText() {
      return `${songTitleFull(currentHymn)}\n\n${currentHymn.lyrics}`;
    }
    async function copyLyrics() {
      if (!currentHymn) return;
      try {
        await navigator.clipboard.writeText(getLyricsText());
        showToast('📋 가사가 복사되었습니다');
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = getLyricsText();
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
        showToast('📋 가사가 복사되었습니다');
      }
    }
    async function shareLyrics() {
      if (!currentHymn) return;
      const title = songTitleFull(currentHymn);
      if (navigator.share) {
        try { await navigator.share({ title, text: getLyricsText() }); } catch (e) {}
      } else await copyLyrics();
    }

    let toastTimer = null;
    function showToast(msg) {
      const t = $('toast');
      t.innerText = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    // ================== 모달 ==================
    function openModal(html) { $('modalBox').innerHTML = html; $('modalWrap').style.display = 'flex'; }
    function closeModal() { $('modalWrap').style.display = 'none'; }

    let _modalCb = null;
    function promptModal(title, placeholder, cb, value) {
      _modalCb = cb;
      openModal(`
        <h3>${esc(title)}</h3>
        <input type="text" id="modalInput" placeholder="${esc(placeholder)}" value="${esc(value || '')}" onkeydown="if(event.key==='Enter')modalOk()">
        <div class="m-btns">
          <button class="m-cancel" onclick="closeModal()">취소</button>
          <button class="m-ok" onclick="modalOk()">확인</button>
        </div>
      `);
      setTimeout(() => { const i = $('modalInput'); if (i) { i.focus(); i.select(); } }, 50);
    }
    function modalOk() {
      const v = $('modalInput') ? $('modalInput').value : '';
      closeModal();
      if (_modalCb) { const cb = _modalCb; _modalCb = null; cb(v); }
    }

    // ================== 🎶 내 CCM 추가 / 수정 ==================
    function openCcmEditor(id) {
      const c = id ? myCcms.find(x => x.id === id) : null;
      openModal(`
        <h3>${c ? '✏️ CCM 수정' : '＋ CCM 곡 추가'}</h3>
        <div class="m-sec-title">제목</div>
        <input type="text" id="ccmTitle" placeholder="예: 주 품에" value="${c ? esc(c.title) : ''}" autocomplete="off">
        <div class="m-sec-title">태그 (쉼표로 구분, 선택)</div>
        <input type="text" id="ccmTags" placeholder="예: 경배, 느린곡" value="${c ? esc((c.tags || []).join(', ')) : ''}" autocomplete="off">
        <div class="m-sec-title">가사</div>
        <textarea id="ccmLyrics" rows="9" placeholder="(1) 첫째 절 가사&#10;(후렴) 후렴 가사&#10;(2) 둘째 절 가사">${c ? esc(c.lyrics) : ''}</textarea>
        <div class="m-note">
          <b>(1) (2) (후렴)</b> 표기를 넣으면 프로젝터에서 한 절씩 넘어가고, 후렴은 색이 다르게 표시됩니다.
        </div>
        <div class="m-btns">
          <button class="m-cancel" onclick="closeModal()">취소</button>
          <button class="m-ok" onclick="saveMyCcm('${c ? c.id : ''}')">저장</button>
        </div>
        ${c ? `<div class="m-btns" style="margin-top:8px;"><button class="m-cancel" style="color:#dc2626;" onclick="deleteMyCcm('${c.id}')">🗑 이 곡 삭제</button></div>` : ''}
        <div class="m-note" style="margin-top:12px;">
          이 곡은 <b>내 폰에만</b> 저장됩니다. 교인 모두에게 배포하려면
          ⚙️ 설정 → <b>내 CCM 내보내기</b>로 텍스트를 뽑아 <code>ccm.json</code>에 반영하세요.
        </div>
      `);
      setTimeout(() => { const i = $('ccmTitle'); if (i) i.focus(); }, 60);
    }

    function saveMyCcm(id) {
      const title = $('ccmTitle').value.trim();
      const lyrics = $('ccmLyrics').value.replace(/\r/g, '').trim();
      const tags = $('ccmTags').value.split(/[,\/]/).map(t => t.trim()).filter(Boolean);
      if (!title) { showToast('제목을 입력해 주세요'); return; }
      if (!lyrics) { showToast('가사를 입력해 주세요'); return; }
      const dup = songIndex.get(id) ? null : ccmAll.find(c => c.title === title);
      if (dup) { showToast('같은 제목의 CCM이 이미 있습니다'); return; }

      if (id) {
        const c = myCcms.find(x => x.id === id);
        if (c) { c.title = title; c.lyrics = lyrics; c.tags = tags; }
      } else {
        myCcms.push({ id: 'my-' + Date.now(), title, lyrics, tags, mine: true });
      }
      saveMyCcms();
      rebuildIndex();
      closeModal();
      showToast(id ? '✅ 수정했습니다' : `✅ '${title}' 추가됨`);
      if (view.screen === 'viewer') { const h = findSong(id); if (h) showViewer(h); }
      else { view.tab = 'ccm'; go({ screen: 'home', tab: 'ccm' }, true); }
    }

    function deleteMyCcm(id) {
      myCcms = myCcms.filter(x => x.id !== id);
      favorites = favorites.filter(f => String(f) !== String(id));
      saveFavs(); saveMyCcms(); rebuildIndex(); closeModal();
      showToast('삭제했습니다');
      go({ screen: 'home', tab: 'ccm' }, true);
    }

    // 변환기(convert_ccm.py) 형식으로 내보내기
    function exportMyCcm() {
      if (!myCcms.length) { showToast('앱에서 추가한 CCM이 없습니다'); return ''; }
      return myCcms.map(c => {
        const head = '=== ' + c.title + ((c.tags || []).length ? ' | 태그: ' + c.tags.join(',') : '');
        return head + '\n' + c.lyrics;
      }).join('\n\n');
    }
    async function copyMyCcm() {
      const t = exportMyCcm(); if (!t) return;
      try { await navigator.clipboard.writeText(t); showToast('📋 복사했습니다'); }
      catch (e) { showToast('복사 실패 — 파일로 저장해 주세요'); }
    }
    function downloadMyCcm() {
      const t = exportMyCcm(); if (!t) return;
      const blob = new Blob([t], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'ccm_원본_추가분.txt';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function openKeypad() {
      padVal = '';
      openModal(`

        <div class="kp-display">
          <div class="kp-num" id="padNum">—</div>
          <div class="kp-title" id="padTitle">번호를 누르세요 (1–645)</div>
        </div>
        <div class="kp-grid">
          ${[1,2,3,4,5,6,7,8,9].map(d => `<button onclick="padPush('${d}')">${d}</button>`).join('')}
          <button onclick="padBack()">⌫</button>
          <button onclick="padPush('0')">0</button>
          <button class="kp-go" id="padGo" onclick="padGo()" disabled>이동</button>
        </div>
        <div class="m-btns" style="margin-top:12px;"><button class="m-cancel" onclick="closeModal()">닫기</button></div>
      `);
    }
    function padPush(d) {
      if (padVal.length >= 3) return;
      const next = (padVal + d).replace(/^0+/, '');
      if (!next) return;
      padVal = next;
      updatePad();
      // 더 이어붙일 수 없는 번호면 자동으로 열기 (예: 645, 70 → 700은 없음)
      if (padVal.length === 3 || parseInt(padVal + '0', 10) > 645) setTimeout(padGo, 130);
    }
    function padBack() { padVal = padVal.slice(0, -1); updatePad(); }
    function updatePad() {
      const h = padVal ? findSong(parseInt(padVal, 10)) : null;
      $('padNum').textContent = padVal || '—';
      $('padTitle').textContent = !padVal ? '번호를 누르세요 (1–645)' : (h ? h.title : '없는 번호입니다');
      const go = $('padGo');
      if (go) go.disabled = !h;
    }
    function padGo() {
      const h = findSong(parseInt(padVal || '0', 10));
      if (!h) { showToast('없는 번호입니다'); return; }
      closeModal();
      openHymn(h.num);

        <div class="ver-box" onclick="verTap()">

          <div class="ver-sub">
            빌드 ${APP_BUILD} · 찬송가 ${hymns.length}곡${ownerMode ? ` · CCM ${ccmAll.length}곡 · 영어 ${enAll.length}곡` : ''}<br>
            ${ownerMode ? '<b style="color:var(--primary)">🔓 내 모드 ON</b> · ' : ''}

            · <span id="verSw">${'serviceWorker' in navigator && navigator.serviceWorker.controller ? '오프라인 저장 사용중' : '오프라인 저장 꺼짐'}</span>

    // 버전 영역을 7번 누르면 저장된 오프라인 캐시를 비우고 최신 파일을 다시 받음
    let verTaps = 0, verTimer = null;
    function verTap() {
      verTaps++;
      clearTimeout(verTimer);
      verTimer = setTimeout(() => { verTaps = 0; }, 1500);
      if (verTaps < 7) {
        if (verTaps >= 4) showToast((7 - verTaps) + '번 더 누르면 강제 업데이트');
        return;
      }
      verTaps = 0;
      forceUpdate();
    }
    async function forceUpdate() {
      const b = $('updBar'); if (b) b.classList.remove('on');
      showToast('최신 버전을 받는 중…');
      try {
        if ('caches' in window) {
          const ks = await caches.keys();
          await Promise.all(ks.map(k => caches.delete(k)));
        }
        if ('serviceWorker' in navigator) {
          const rs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(rs.map(r => r.unregister()));
        }
      } catch (e) { /* 무시 */ }
      setTimeout(() => location.reload(true), 500);
    }

    async function copyBackup() {
      try { await navigator.clipboard.writeText(window._backupData); showToast('📋 백업이 복사되었습니다'); }
      catch (e) { showToast('복사 실패 — 파일로 저장해 주세요'); }
    }
    function downloadBackup() {
      const blob = new Blob([window._backupData], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '새찬송가_백업.json';
      a.click();
      URL.revokeObjectURL(a.href);
    }
    function restoreBackup() {
      const raw = $('restoreBox').value.trim();
      if (!raw) { showToast('백업 텍스트를 붙여넣어 주세요'); return; }
      try {
        const d = JSON.parse(raw);
        if (d.app !== 'hymnal-backup') throw 0;
        if (Array.isArray(d.favs)) { favorites = d.favs; localStorage.setItem('hymn_favs', JSON.stringify(favorites)); }
        if (Array.isArray(d.lists)) { playlists = d.lists; saveLists(); }
        if (Array.isArray(d.cats)) { customCats = d.cats; saveCats(); }
        if (d.extras && typeof d.extras === 'object') { catExtras = d.extras; saveCatExtras(); }
        if (Array.isArray(d.recent)) { recents = d.recent; localStorage.setItem('hymn_recent', JSON.stringify(recents)); }
        if (Array.isArray(d.myccm)) { myCcms = d.myccm; saveMyCcms(); }
        if (d.size) { fontSize = d.size; localStorage.setItem('hymn_size', d.size); }
        if (d.projSize) localStorage.setItem('hymn_proj_size', d.projSize);
        if (d.favSort) localStorage.setItem('hymn_fav_sort', d.favSort);
        if (typeof d.dark === 'number') localStorage.setItem('hymn_dark', d.dark);
        showToast('✅ 복원 완료');
        setTimeout(() => location.reload(), 600);
      } catch (e) { showToast('❌ 올바른 백업 데이터가 아닙니다'); }
    }

    function changeFontSize(val) { setFontSize(fontSize + val); }

      fontSize = Math.min(Math.max(16, parseInt(val, 10) || 22), 48);
      $('viewerLyrics').style.fontSize = fontSize + 'px';
      localStorage.setItem('hymn_size', fontSize);
      const r = $('sizeRange'), v = $('sizeVal'), p = $('sizePrev');

      if (v) v.textContent = fontSize + 'px';
      if (p) p.style.fontSize = fontSize + 'px';

    function setProjSize(val) {
      projScale = Math.min(Math.max(60, parseInt(val, 10) || 100), 220);
      localStorage.setItem('hymn_proj_size', projScale);
      document.documentElement.style.setProperty('--proj-scale', projScale / 100);
      const r = $('projRange'), v = $('projVal');
      if (r) r.value = projScale;
      if (v) v.textContent = projScale + '%';

    function changeProjSize(delta) { setProjSize(projScale + delta); showToast('프로젝터 글자 ' + (projScale) + '%'); }
    function toggleDarkMode() {

    function applyThemeColor() {

    // ================== 탭 / 검색 이벤트 ==================

    function applyOwnerTabs() {

    // 켜기/끄기 전에 무엇이 달라지는지 분명히 보여 주고 확인받는다

            탭: 찬송가 · 즐겨찾기 · 분류별 · 예배순서<br><br>
            <b>지워지는 것은 없습니다.</b> 즐겨찾기·예배순서·내가 추가한 CCM 모두 그대로 남아 있고,

          </div>
          <div class="m-btns">
            <button class="m-cancel" onclick="closeModal()">취소</button>
            <button class="m-ok" onclick="setOwnerMode(false)">교인용으로 되돌리기</button>
          </div>`);

    function setOwnerMode(on) {
      ownerMode = !!on;
      localStorage.setItem('hymn_owner', ownerMode ? '1' : '0');
      if (!ownerMode) {
        ccms = []; ens = []; ccmTag = ''; enTag = '';
        if (view.tab === 'ccm' || view.tab === 'en') view.tab = 'all';
        rebuildIndex();
        closeModal();
        go({ screen: 'home', tab: 'all' }, true);
        showToast('🔒 교인용 화면으로 돌아왔습니다 (탭 4개)');
      } else {
        showToast('🔓 내 모드 켜짐 — 곡을 불러오는 중…');
        Promise.all([
          fetch('ccm.json').then(r => (r.ok ? r.json() : [])).catch(() => []),
          fetch('en.json').then(r => (r.ok ? r.json() : [])).catch(() => [])
        ]).then(([c, e]) => {
          ccms = (Array.isArray(c) ? c : []).map((x, i) => ({
            id: x.id || ('ccm-' + String(i + 1).padStart(3, '0')),

          ens = (Array.isArray(e) ? e : []).map((x, i) => ({
            id: x.id || ('en-' + String(i + 1).padStart(3, '0')),
            title: x.title || '(no title)', lyrics: x.lyrics || '',
            tags: Array.isArray(x.tags) ? x.tags : [],
            artist: x.artist || '', key: x.key || '', youtube: x.youtube || '',
            hymnNum: x.hymnNum || 0
          }));

          closeModal();
          applyView();
          showToast(`🔓 내 모드 켜짐 — CCM ${ccmAll.length}곡 · 영어 ${enAll.length}곡`);
          setTimeout(openSettings, 400);   // 켜진 상태를 눈으로 확인시켜 줌

    function changeTab(tab) {
      if (view.screen === 'home' && view.tab === tab) return;
      pendingDelete = false;
      // 뒤로가기를 누르면 방금 보던 탭으로 되돌아가고, 맨 끝(찬송가 탭)에서만 앱이 닫히도록
      // 탭 이동도 방문 기록에 남긴다
      go({ screen: 'home', tab }, false);
    }

    // 타자 칠 때마다 645곡을 다시 그리면 느려서, 잠깐 멈출 때만 그린다
    let searchTimer = null;
    function runSearchRender() {
      if (view.screen === 'home') renderHome();
      else if (view.screen === 'category') renderCategory();
      else if (view.screen === 'playlist' || view.screen === 'customcat') renderPlaylistDetail(view.id);
    }
    // 검색창에 '내모드' 를 입력하면 내 모드 켜기/끄기 창이 열린다 (내가 쓰는 비밀 암호어)
    const OWNER_WORDS = ['내모드', '내 모드', '#내모드', 'mymode', '0000'];
    function checkOwnerWord() {
      const raw = $('searchInput').value.trim().toLowerCase();
      if (!OWNER_WORDS.includes(raw)) return false;
      $('searchInput').value = '';
      $('searchInput').blur();
      runSearchRender();
      askOwnerMode(!ownerMode);
      return true;
    }

    $('searchInput').addEventListener('input', () => {
      if (checkOwnerWord()) return;
      if (view.screen === 'home' && (view.tab === 'cat' || view.tab === 'list')) {
        const q = $('searchInput').value.trim();
        if (q) { go({ screen: 'home', tab: 'all' }, true); return; }
      }
      const q = $('searchInput').value.trim();
      clearTimeout(searchTimer);
      // 지운 경우·번호 검색은 즉시, 그 외에는 140ms 뒤에
      if (!q || /^\d+$/.test(q)) runSearchRender();
      else searchTimer = setTimeout(runSearchRender, 140);
    });

    // 번호 입력 + Enter → 바로 열기
    $('searchInput').addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const q = $('searchInput').value.trim();
      if (/^\d{1,3}$/.test(q)) {
        const h = findSong(parseInt(q, 10));
        if (h) { $('searchInput').blur(); openHymn(h.num); }
      }
    });

    // Esc → 뒤로가기 (프로젝터/뷰어)
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if ($('modalWrap').style.display === 'flex') { closeModal(); return; }   // 모달만 닫기
      history.back();
    });

    // ================== 스와이프: 가사 화면에서 이전/다음 장 ==================
    let vTsX = 0, vTsY = 0, vTsT = 0;
    $('viewerLyrics').addEventListener('touchstart', e => {
      if (e.touches.length > 1) { vTsT = 0; return; }        // 두 손가락(확대) 중이면 스와이프 무시
      vTsX = e.touches[0].clientX; vTsY = e.touches[0].clientY; vTsT = Date.now();
    }, { passive: true });
    $('viewerLyrics').addEventListener('touchend', e => {
      if (!vTsT || pinching) return;
      const dx = e.changedTouches[0].clientX - vTsX;
      const dy = e.changedTouches[0].clientY - vTsY;
      if (Date.now() - vTsT > 600) return;
      if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return; // 확실한 좌우 스와이프만
      swipeHymn(dx < 0 ? 1 : -1);
    }, { passive: true });

    function swipeHymn(dir) {
      if (!currentHymn) return;
      let nx = null;
      if (currentHymn.book === 'hymn') {
        const n = currentHymn.num + dir;
        if (n >= 1 && n <= maxHymnNum) nx = findSong(n);
      } else {
        const pool = currentHymn.book === 'en' ? enAll : ccmAll;
        const i = pool.indexOf(currentHymn) + dir;
        if (i >= 0 && i < pool.length) nx = pool[i];
      }
      if (!nx) { showToast(dir > 0 ? '마지막 곡입니다' : '처음 곡입니다'); return; }
      playlistCtx = null;
      animEl($('viewerLyrics'), dir);
      go({ screen: 'viewer', tab: view.tab, num: keyOf(nx) }, true);
    }


    // ================== 두 손가락으로 글자 키우기/줄이기 (핀치 줌) ==================
    // 브라우저 기본 확대(화면 전체가 커져 가로로 잘리는 방식) 대신,
    // 글자 크기 자체를 바꿔서 가사가 항상 화면 폭 안에서 자동으로 줄바꿈되게 한다.
    let pinching = false;
    let zoomBadgeTimer = null;
    function showZoomBadge(text) {
      const b = $('zoomBadge');
      if (!b) return;
      b.textContent = text; b.classList.add('on');
      clearTimeout(zoomBadgeTimer);
    }
    function hideZoomBadge() {
      const b = $('zoomBadge');
      if (!b) return;
      clearTimeout(zoomBadgeTimer);
      zoomBadgeTimer = setTimeout(() => b.classList.remove('on'), 500);
    }
    function attachPinchZoom(el, getVal, setVal, label) {
      if (!el) return;
      let base = 0, startDist = 0, active = false;
      const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
      el.addEventListener('touchstart', e => {
        if (e.touches.length !== 2) return;
        active = true; pinching = true;
        startDist = dist(e.touches) || 1;
        base = getVal();
        showZoomBadge(label(base));
      }, { passive: true });
      el.addEventListener('touchmove', e => {
        if (!active || e.touches.length !== 2) return;
        e.preventDefault();                       // 브라우저 기본 확대 차단
        const ratio = dist(e.touches) / startDist;
        setVal(Math.round(base * ratio));
        showZoomBadge(label(getVal()));
      }, { passive: false });
      const end = () => {
        if (!active) return;
        active = false; hideZoomBadge();
        setTimeout(() => { pinching = false; }, 300);
      };
      el.addEventListener('touchend', end, { passive: true });
      el.addEventListener('touchcancel', end, { passive: true });
      // 아이폰 사파리 전용 제스처 이벤트
      el.addEventListener('gesturestart', e => {
        e.preventDefault(); pinching = true; base = getVal(); showZoomBadge(label(base));
      }, { passive: false });
      el.addEventListener('gesturechange', e => {
        e.preventDefault(); setVal(Math.round(base * e.scale)); showZoomBadge(label(getVal()));
      }, { passive: false });
      el.addEventListener('gestureend', e => {
        e.preventDefault(); hideZoomBadge(); setTimeout(() => { pinching = false; }, 300);
      }, { passive: false });
    }
    attachPinchZoom($('viewerLyrics'), () => fontSize, v => setFontSize(v), v => '글자 ' + v + 'px');
    attachPinchZoom($('projSlide'),    () => projScale, v => setProjSize(v), v => '프로젝터 ' + v + '%');

    // 요소에 좌/우 슬라이드 애니메이션 적용
    function animEl(el, dir) {
      el.classList.remove('anim-next', 'anim-prev');
      void el.offsetWidth;  // 애니메이션 재시작 트릭
      el.classList.add(dir > 0 ? 'anim-next' : 'anim-prev');
    }

    // PWA 서비스 워커 등록 (http/https에서만, file://은 무시)
    let swReg = null;
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      // ① 주소에 버전을 붙여 등록 → 새 버전을 올리면 주소가 바뀌므로
      //    GitHub CDN(10분 캐시)이 옛 sw.js를 돌려주는 문제를 건너뛴다
      // ② updateViaCache:'none' → 브라우저가 sw.js 를 캐시에서 꺼내 쓰지 않는다
      navigator.serviceWorker.register('sw.js?v=' + APP_VERSION, { updateViaCache: 'none' })
        .then(reg => { swReg = reg; setTimeout(() => { try { reg.update(); } catch (e) {} }, 3000); })
        .catch(() => {});
    }

    // ================== 🔄 새 버전 자동 감지 ==================
    // GitHub Pages 는 파일을 CDN 에 10분간 캐시하고,
    // 설치된 앱(PWA)은 되살아날 때 페이지를 새로 열지 않아 업데이트를 놓치기 쉽다.
    // → version.json 을 캐시 우회(시각 붙이기 + no-store)로 직접 확인한다.
    let lastUpdCheck = 0;
    let updDismissed = '';
    async function checkForUpdate(silent) {
      if (location.protocol === 'file:') return;
      const now = Date.now();
      if (silent && now - lastUpdCheck < 60000) return;   // 1분에 한 번만
      lastUpdCheck = now;
      try {
        const r = await fetch('version.json?t=' + now, { cache: 'no-store' });
        if (!r.ok) return;
        const d = await r.json();
        if (!d || !d.version) return;
        if (d.version !== APP_VERSION && d.version !== updDismissed) {
          showUpdateBar(d.version);
        }
      } catch (e) { /* 오프라인이면 조용히 넘어감 */ }
      try { if (swReg) swReg.update(); } catch (e) {}
    }
    function showUpdateBar(v) {
      const b = $('updBar'), t = $('updVer');
      if (!b) return;
      if (t) t.textContent = '(' + v + ')';
      b.classList.add('on');
      b.dataset.ver = v;
    }
    function dismissUpdate() {
      const b = $('updBar');
      updDismissed = (b && b.dataset.ver) || '';
      if (b) b.classList.remove('on');
      showToast('설정 맨 아래 버전을 7번 누르면 언제든 업데이트됩니다');
    }
    // 앱을 켤 때, 그리고 다른 앱 쓰다가 돌아올 때마다 확인
    setTimeout(() => checkForUpdate(false), 1500);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') checkForUpdate(true);
    });
    window.addEventListener('focus', () => checkForUpdate(true));
    window.addEventListener('online', () => checkForUpdate(true));
  </script>
  <div id="zoomBadge"></div>
  <div id="updBar">
    <div class="txt">새 버전이 나왔습니다 <span id="updVer"></span><small>눌러서 바로 받기 (몇 초면 끝납니다)</small></div>
    <button onclick="forceUpdate()">업데이트</button>
    <button class="later" onclick="dismissUpdate()">나중에</button>
  </div>
</body>
</html>
