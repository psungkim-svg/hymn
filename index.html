<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>새찬송가</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #191f28;
      --sub-text: #8b95a1;
      --card-bg: #f9fafb;
      --primary: #2563eb;
      --border: #e5e8eb;
      --star-color: #f59e0b;
    }
    body.dark-mode {
      --bg: #121212;
      --text: #f3f4f6;
      --sub-text: #9ca3af;
      --card-bg: #1e1e1e;
      --primary: #60a5fa;
      --border: #2e2e2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard, sans-serif; }
    body { background: var(--bg); color: var(--text); user-select: none; }

    /* 상단 헤더 & 검색창 */
    header {
      position: sticky;
      top: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }
    .search-input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      background: var(--card-bg);
      color: var(--text);
      outline: none;
    }
    .btn-icon {
      padding: 0 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      color: var(--text);
    }

    /* 탭 메뉴 (전체 / 즐겨찾기) */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      font-size: 16px;
      font-weight: bold;
      color: var(--sub-text);
      cursor: pointer;
    }
    .tab.active {
      color: var(--primary);
      border-bottom: 3px solid var(--primary);
    }

    /* 리스트 */
    .list-view {
      padding: 6px 0;
      max-height: calc(100vh - 125px);
      overflow-y: auto;
    }
    .hymn-card {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .hymn-num {
      width: 55px;
      font-size: 17px;
      font-weight: bold;
      color: var(--primary);
    }
    .hymn-title {
      flex: 1;
      font-size: 17px;
      font-weight: 500;
    }
    .star-icon {
      font-size: 22px;
      color: #d1d5db;
    }
    .star-icon.active {
      color: var(--star-color);
    }

    /* 가사 상세 화면 (뷰어) */
    #viewer {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg);
      flex-direction: column;
      z-index: 200;
    }
    .viewer-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .viewer-title {
      font-size: 18px;
      font-weight: bold;
      max-width: 50%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .font-btns {
      display: flex;
      gap: 6px;
    }
    .font-btns button {
      padding: 6px 10px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .viewer-lyrics {
      flex: 1;
      padding: 24px 20px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.7;
    }
  </style>
</head>
<body>

  <!-- 상단 검색바 -->
  <header>
    <input type="text" id="searchInput" class="search-input" placeholder="장 번호(숫자), 제목, 가사 검색">
    <button class="btn-icon" onclick="toggleDarkMode()">🌙</button>
  </header>

  <!-- 탭 메뉴 -->
  <div class="tabs">
    <div class="tab active" id="tabAll" onclick="changeTab('all')">전체 찬송가</div>
    <div class="tab" id="tabFav" onclick="changeTab('fav')">⭐ 즐겨찾기</div>
  </div>

  <!-- 찬송가 목록 -->
  <div class="list-view" id="hymnList"></div>

  <!-- 가사 뷰어 -->
  <div id="viewer">
    <div class="viewer-header">
      <button class="font-btns" style="padding: 8px 14px;" onclick="closeViewer()">⬅ 뒤로</button>
      <div class="viewer-title" id="viewerTitle"></div>
      <div class="font-btns">
        <button onclick="changeFontSize(-2)">가-</button>
        <button onclick="changeFontSize(2)">가+</button>
        <button id="viewerStar" onclick="toggleFavCurrent()" style="font-size:16px;">★</button>
      </div>
    </div>
    <div class="viewer-lyrics" id="viewerLyrics"></div>
  </div>

  <script>
    let hymns = [];
    let currentTab = 'all';
    let currentHymn = null;
    let fontSize = parseInt(localStorage.getItem('hymn_size') || '22', 10);
    let favorites = JSON.parse(localStorage.getItem('hymn_favs') || '[]');

    // hymns.json 데이터 불러오기
    fetch('hymns.json')
      .then(res => res.json())
      .then(data => {
        hymns = data;
        render();
      })
      .catch(err => {
        alert('hymns.json 파일을 불러오지 못했습니다. 같은 폴더에 있는지 확인해주세요.');
      });

    // 목록 화면 표시
    function render() {
      const list = document.getElementById('hymnList');
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      list.innerHTML = '';

      const filtered = hymns.filter(h => {
        const isFav = favorites.includes(h.num);
        if (currentTab === 'fav' && !isFav) return false;
        if (!q) return true;

        return h.num.toString() === q ||
               h.title.toLowerCase().includes(q) ||
               h.lyrics.toLowerCase().includes(q);
      });

      if (filtered.length === 0) {
        list.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--sub-text);">검색 결과가 없습니다.</div>';
        return;
      }

      filtered.forEach(h => {
        const item = document.createElement('div');
        item.className = 'hymn-card';
        item.innerHTML = `
          <div class="hymn-num">${h.num}장</div>
          <div class="hymn-title">${h.title}</div>
          <div class="star-icon ${favorites.includes(h.num) ? 'active' : ''}">★</div>
        `;
        item.onclick = () => openViewer(h);
        list.appendChild(item);
      });
    }

    // 뷰어 열기
    function openViewer(h) {
      currentHymn = h;
      document.getElementById('viewerTitle').innerText = `${h.num}장 ${h.title}`;
      const lyricsBox = document.getElementById('viewerLyrics');
      lyricsBox.innerText = h.lyrics;
      lyricsBox.style.fontSize = fontSize + 'px';

      updateViewerStar();
      document.getElementById('viewer').style.display = 'flex';
    }

    function closeViewer() {
      document.getElementById('viewer').style.display = 'none';
      render();
    }

    // 즐겨찾기 토글
    function toggleFavCurrent() {
      if (!currentHymn) return;
      const idx = favorites.indexOf(currentHymn.num);
      if (idx > -1) favorites.splice(idx, 1);
      else favorites.push(currentHymn.num);

      localStorage.setItem('hymn_favs', JSON.stringify(favorites));
      updateViewerStar();
    }

    function updateViewerStar() {
      const star = document.getElementById('viewerStar');
      const isFav = favorites.includes(currentHymn.num);
      star.style.color = isFav ? '#f59e0b' : 'inherit';
    }

    // 글자 크기
    function changeFontSize(val) {
      fontSize = Math.min(Math.max(16, fontSize + val), 40);
      document.getElementById('viewerLyrics').style.fontSize = fontSize + 'px';
      localStorage.setItem('hymn_size', fontSize);
    }

    // 다크모드
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    // 탭 전환
    function changeTab(tab) {
      currentTab = tab;
      document.getElementById('tabAll').className = 'tab ' + (tab === 'all' ? 'active' : '');
      document.getElementById('tabFav').className = 'tab ' + (tab === 'fav' ? 'active' : '');
      render();
    }

    document.getElementById('searchInput').addEventListener('input', render);
  </script>
</body>
</html>
